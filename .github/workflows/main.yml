name: Salesforce CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. Validate Stage: Compare files and run validation
  validate_deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    container:
      image: salesforce/cli:latest-slim
      options: --user root # Fixes permission issues inside container
    steps:
      - name: Install Git & Dependencies
        run: |
          apt-get update && apt-get install -y git

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Required to compare HEAD~1 and HEAD

      - name: Verify CLI versions
        run: |
          node --version
          sf --version

      - name: Authenticate Salesforce Org
        env:
          SF_AUTH_DEV: ${{ secrets.SF_AUTH_DEV }}
        run: |
          test -n "$SF_AUTH_DEV" || { echo "SF_AUTH_DEV must be set in GitHub Actions Secrets"; exit 1; }
          echo "$SF_AUTH_DEV" | sf org login sfdx-url --alias myOrg --set-default --sfdx-url-stdin -

      - name: Check changed files
        run: |
          echo "Checking files changed between previous commit and current commit..."
          git diff --name-only HEAD~1 HEAD || true

      - name: Validate deployment
        run: |
          echo "Running deployment validation check..."
          sf project deploy validate --target-org myOrg --source-dir force-app --wait 30

  # 2. Test Stage: Run Apex tests and save results
  run_apex_tests:
    name: Run Apex Tests
    runs-on: ubuntu-latest
    needs: validate_deployment
    container:
      image: salesforce/cli:latest-slim
      options: --user root
    steps:
      - name: Install Git
        run: |
          apt-get update && apt-get install -y git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate Salesforce Org
        env:
          SF_AUTH_DEV: ${{ secrets.SF_AUTH_DEV }}
        run: |
          test -n "$SF_AUTH_DEV" || { echo "SF_AUTH_DEV must be set in GitHub Actions Secrets"; exit 1; }
          echo "$SF_AUTH_DEV" | sf org login sfdx-url --alias myOrg --set-default --sfdx-url-stdin -

      - name: Run Apex tests
        run: |
          echo "Running Apex tests..."
          mkdir -p tests/apex
          sf apex run test --target-org myOrg --test-level RunLocalTests --result-format junit --output-dir tests/apex --code-coverage --wait 30
          echo "Apex tests completed and saved!"

      - name: Upload Apex test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-results
          path: tests/apex/
          retention-days: 30

  # 3 & 4. Manual Approval Gate + Deploy Stage
  deploy_to_org:
    name: Deploy to Org
    runs-on: ubuntu-latest
    needs: run_apex_tests
    environment: production # Pauses here until a reviewer approves in GitHub UI
    container:
      image: salesforce/cli:latest-slim
      options: --user root
    steps:
      - name: Install Git
        run: |
          apt-get update && apt-get install -y git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate Salesforce Org
        env:
          SF_AUTH_DEV: ${{ secrets.SF_AUTH_DEV }}
        run: |
          echo "Deployment manually approved by ${{ github.actor }}"
          test -n "$SF_AUTH_DEV" || { echo "SF_AUTH_DEV must be set in GitHub Actions Secrets"; exit 1; }
          echo "$SF_AUTH_DEV" | sf org login sfdx-url --alias myOrg --set-default --sfdx-url-stdin -

      - name: Deploy to Salesforce
        run: |
          echo "Starting deployment to Salesforce..."
          sf project deploy start --target-org myOrg --source-dir force-app --wait 30
          echo "Deployment completed successfully!"

  # 5. Audit Stage: Export SetupAuditTrail to CSV
  export_audit_trail:
    name: Export SetupAuditTrail
    runs-on: ubuntu-latest
    needs: deploy_to_org
    container:
      image: salesforce/cli:latest-slim
      options: --user root
    steps:
      - name: Authenticate Salesforce Org
        env:
          SF_AUTH_DEV: ${{ secrets.SF_AUTH_DEV }}
        run: |
          test -n "$SF_AUTH_DEV" || { echo "SF_AUTH_DEV must be set in GitHub Actions Secrets"; exit 1; }
          echo "$SF_AUTH_DEV" | sf org login sfdx-url --alias myOrg --set-default --sfdx-url-stdin -

      - name: Query SetupAuditTrail
        run: |
          echo "Querying SetupAuditTrail..."
          mkdir -p audit
          sf data query --query "SELECT Id, Section, DelegateUser, Display, Action, CreatedByIssuer, CreatedDate FROM SetupAuditTrail ORDER BY CreatedDate DESC" --target-org myOrg --result-format csv > audit/setup_audit_trail.csv
          echo "Audit trail saved!"

      - name: Upload SetupAuditTrail artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-audit-trail
          path: audit/
          retention-days: 30
